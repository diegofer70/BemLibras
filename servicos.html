<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Bem Libras - Conectando mundos através da Língua Brasileira de Sinais. Serviços especializados de interpretação e tradução em Libras."
    />
    <title>Portfólio</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Header -->
    <header class="header" role="banner">
      <nav class="nav" role="navigation" aria-label="Navegação principal">
        <div class="nav-container">
          <div class="logo">
            <a href="#inicio" aria-label="Bem Libras - Página inicial">
              <img
                style="width: 250px"
                src="./image/logo-bemlibras-horizontal-preto.png"
                alt="Logo Bem Libras"
              />
            </a>
          </div>
          <button
            class="menu-toggle"
            aria-label="Abrir menu"
            aria-expanded="false"
            id="menuToggle"
          >
            <span></span>
            <span></span>
            <span></span>
          </button>
          <ul class="nav-menu" id="navMenu">
            <li><a href="#inicio" class="nav-link">Início</a></li>
            <li><a href="#servicos" class="nav-link">Serviços</a></li>
            <li><a href="#sobre" class="nav-link">Sobre</a></li>
            <li><a href="#contato" class="nav-link">Contato</a></li>
          </ul>
        </div>
      </nav>
    </header>

    <!-- Services Section -->
    <section>
        <div class="container">
            <h1>Nossos Serviços</h1>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer" role="contentinfo">
      <div class="container">
        <div class="footer-content">
          <div class="footer-left">
            <div class="footer-logo">
              <div>
                <img
                  style="height: 90px"
                  src="./image/logo-bemlibras-horizontal-preto.png"
                  alt="Logo Bem Libras"
                />
              </div>
              <h3 class="footer-title">Atendimento ao Público</h3>
              <p class="footer-subtitle">
                Conectando mundos através da Língua Brasileira de Sinais
              </p>
            </div>
            <div class="footer-social">
              <a
                href="https://www.instagram.com/rayangabriels"
                target="_blank"
                aria-label="Instagram"
                class="social-icon"
              >
                <img src="./image/instagram.svg" alt="Instagram" />
              </a>
            </div>
          </div>
          <div>
            <a href="#inicio" class="back-to-top" aria-label="Voltar ao topo">
              Voltar ao topo
              <img src="./image/Volver-Arriba.svg" alt="Seta para cima" />
            </a>
          </div>
        </div>
        <div class="footer-bottom">
          <div class="footer-divider"></div>
          <div class="footer-bottom-content">
            <p class="footer-copyright">
              © 2026 BemLibras. Todos os direitos reservados.
            </p>
            <!-- <div class="footer-legal">
                        <a href="#">Política de Privacidade</a>
                        <a href="#">Termos de Uso</a>
                        <a href="#">Cookies</a>
                    </div> -->
          </div>
        </div>
      </div>
    </footer>
  </body>
</html>
